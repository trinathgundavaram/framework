  MaaGOVCOMPLIANCEITSNS:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "RJMaaGOVCOMPLITSNS"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Topics
            Effect: Allow
            Action:
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:ListTopics
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:GetDataProtectionPolicy
              - sns:PutDataProtectionPolicy
              - sns:AddPermission
              - sns:RemovePermission
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:GetSubscriptionAttributes
              - sns:ListSubscriptionsByTopic
              - sns:Publish
              - sns:ListTagsForResource
              - sns:TagResource
              - sns:UntagResource
            Resource:
              - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:maa-*
              - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:usmis-*
              - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:*mrr*
              - !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:compliance*
            Condition:
              ForAnyValue:StringEquals:
                aws:ResourceAccount:
                  - !Sub ${AWS::AccountId}
          - Sid: EventRulesRemove
            Effect: Allow
            Action:
              - events:Delete*
              - events:Remove*
              - events:UnTag*
            Resource:
              - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/maa-*
              - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/maa_*
              - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:rule/compliance*
          - Sid: ApiGateway
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:PUT
              - apigateway:POST
              - apigateway:PATCH
              - apigateway:DELETE
              - apigateway:UpdateRestApiPolicy
              - apigateway:SetWebACL
              - apigateway:UpdateAccount
            Resource:
              - !Sub "arn:aws:apigateway:*::/*"
          - Sid: PassRoleToApiGatewayAndAirflow
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: "*"
            Condition:
              ForAnyValue:StringEquals:
                iam:PassedToService:
                  - apigateway.amazonaws.com
                  - airflow.amazonaws.com
          - Sid: Waf
            Effect: Allow
            Action:
              - wafv2:AssociateWebACL
            Resource: "*"
          - Sid: Airflow
            Effect: Allow
            Action:
              - airflow:GetEnvironment
            Resource:
              - !Sub arn:aws:airflow:${AWS::Region}:${AWS::AccountId}:environment/*

  MaaGOVCOMPLIANCEITProcess:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "RJMaaGOVCOMPLITProcess"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Lambda
            Effect: Allow
            Action:
              - lambda:Create*
              - lambda:Get*
              - lambda:List*
              - lambda:Update*
              - lambda:Put*
              - lambda:Delete*
              - lambda:Publish*
              - lambda:InvokeFunction
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:EnableReplication*
              - lambda:DisableReplication*
              - lambda:TagResource*
