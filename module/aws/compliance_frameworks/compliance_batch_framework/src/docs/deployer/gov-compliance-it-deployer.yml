            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/maa-*
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/MAA*
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/Glue*
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/compliance*
          - Sid: PolicyEntities
            Effect: Allow
            Action:
              - iam:ListEntitiesForPolicy
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:policy/maa-*
