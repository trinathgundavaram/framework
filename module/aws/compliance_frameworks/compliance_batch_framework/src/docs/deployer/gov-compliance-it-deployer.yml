              - !Sub arn:aws:iam::${AWS::AccountId}:role/MAA*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/compliance*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/ENTERPRISE/MAA*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/ENTERPRISE/compliance*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/golden-vpc-flow-logs*
          - Sid: GetAndPassRoles
            Effect: Allow
