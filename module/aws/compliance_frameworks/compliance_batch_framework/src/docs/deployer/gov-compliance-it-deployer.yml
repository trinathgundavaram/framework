              - iam:ListRoles
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/*
          - Sid: ManagedPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:GetPolicy
              - iam:UpdatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
