              - !Sub arn:aws:s3:::silverton-maa-*-*-${Env}*
              - !Sub arn:aws:s3:::silverton-maa-*-*-${Env}*/*
              - !Sub arn:aws:s3:::silverton*
              - arn:aws:s3:::compliance*
              - arn:aws:s3:::compliance*/*
              - arn:aws:s3:::silverton-maa-db-*-artifacts
              - arn:aws:s3:::silverton-maa-db-*-artifacts/*
              - arn:aws:s3:::silverton-maa-*-db-schema-migration
              - arn:aws:s3:::silverton-maa-*-db-schema-migration/*
              - arn:aws:s3:::silverton-maa-product-catalog-*
              - !Sub arn:aws:s3:::silverton-maa-product-catalog-data-${Env}/*
              - !Sub arn:aws:s3:::silverton-maa-product-catalog-artifacts-${Env}
              - !Sub arn:aws:s3:::silverton-maa-product-catalog-artifacts-${Env}/*
            Effect: Allow
          - Action:
              - kms:ListKeys
              - kms:Create*
              - kms:ListAliases
              - kms:ListGrants
              - kms:ListResourceTags
              - kms:TagResource
              - kms:RevokeGrant
            Resource:
              - '*'
            Effect: Allow
          - Action:
              - kms:DescribeKey
              - kms:Decrypt
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:GenerateDataKey
              - kms:PutKeyPolicy
              - kms:UntagResource
              - kms:UpdateKeyDescription
              - kms:UpdateAlias
              - kms:Encrypt
              - kms:Delete*
              - kms:ReEncrypt*
              - kms:Describe*
              - kms:CreateGrant
              - kms:CreateAlias
              - kms:RetireGrant
              - kms:ScheduleKeyDeletion
            Resource:
                - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*
                - !Sub arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/*

            Effect: Allow
          - Action:
              - acm:RequestCertificate
              - acm:AddTagsToCertificate
              - acm:DescribeCertificate
              - acm:ListTagsForCertificate
              - cloudfront:List*
              - acm:ListCertificates
              - acm:GetCertificate
