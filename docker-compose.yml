# Local Postgres for development and tests:
#   docker compose up -d
#   export FRAMEWORK_DB_DSN=postgresql://framework:framework@localhost:5432/framework
#   export TEST_DATABASE_URL=$FRAMEWORK_DB_DSN
#   framework init-db && pytest
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework
      POSTGRES_DB: framework
    ports: ["5432:5432"]
