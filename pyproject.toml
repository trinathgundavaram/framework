[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-compliance-framework"
version = "0.1.0"
description = "Project-agnostic, filename-driven CMS compliance file ingestion, validation, promotion and extract-trigger framework"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]>=3.1",
  "croniter>=1.4",
]

[project.optional-dependencies]
aws   = ["boto3>=1.28"]
pandas = ["pandas>=1.5"]
spark = ["pyspark>=3.3"]
excel = ["pandas>=1.5", "openpyxl>=3.1"]
parquet = ["pandas>=1.5", "pyarrow>=12"]
dev   = ["pytest>=7", "pytest-cov>=4", "pandas>=1.5", "boto3>=1.28"]

[project.scripts]
framework = "framework.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framework = ["sql/**/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
